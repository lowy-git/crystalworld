# 构建门禁 + GitHub Pages 部署：push 到 main 即
#   1) 重新生成 index.html（源码与成品永不脱节）
#   2) 跑全部断言（201 应用 + 24 内核）——不过不部署
#   3) 把 index.html 发布到 GitHub Pages
# 首次启用：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成成品
        run: node src/make-app.mjs
      - name: 应用断言（201 条）
        run: node src/app-check.mjs
      - name: 内核断言（24 条）
        run: node src/check.mjs
      - name: 部署暂存
        run: mkdir -p _pages && cp index.html _pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
